[package]
name = "cloud-session-host"
description = "Entry A: runs `ahoc` per workspace and bridges aho rpc (NDJSON over stdio) to a WebSocket; relays sandbox terminals and chats to the runtime agent."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cloud-session-host"
path = "src/main.rs"

[dependencies]
cloud-api.workspace = true
cloud-contract.workspace = true
cloud-workdir.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
clap = { workspace = true, features = ["env"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
uuid.workspace = true
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
aho-log.workspace = true
aho-types.workspace = true
cloud-draft.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tar = "0.4"
flate2 = "1"

[lints]
workspace = true
