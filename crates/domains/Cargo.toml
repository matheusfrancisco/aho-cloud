[package]
name = "cloud-domains"
description = "Domain bindings for aho cloud: TXT tokens, DNS checks, grace and tombstones, ACME issuance, the certificate store, the authoritative zone server, RDAP expiry."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cloud-contract.workspace = true
cloud-api.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest.workspace = true
time.workspace = true
uuid.workspace = true
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
parking_lot = "0.12"
async-trait = "0.1"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
hickory-server = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
x509-parser = "0.18"
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
rcgen = "0.14"
hickory-net = "0.26"

[lints]
workspace = true
