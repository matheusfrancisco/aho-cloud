[package]
name = "cloud-builder"
description = "Source to OCI image for aho cloud: fetches git or archive sources, builds with BuildKit (Dockerfile, command) or pack (buildpacks), pushes, and returns the digest."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cloud-builder"
path = "src/main.rs"

[dependencies]
cloud-api.workspace = true
cloud-contract.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
tempfile.workspace = true
clap = { workspace = true, features = ["env"] }
tar = "0.4"
flate2 = "1"
parking_lot = "0.12"
nix = { version = "0.30", features = ["signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[lints]
workspace = true
