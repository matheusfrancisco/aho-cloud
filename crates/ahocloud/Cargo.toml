[package]
name = "ahocloud"
description = "The aho cloud customer CLI: login, manifest init/check, deploy, approve, releases, rollback, domains, secrets."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ahocloud"
path = "src/main.rs"

[dependencies]
cloud-contract.workspace = true
cloud-api = { workspace = true, features = ["client"] }
cloud-importers.workspace = true
cloud-draft.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
clap = { workspace = true, features = ["env"] }
base64.workspace = true
blake3.workspace = true
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ignore = "0.4"
tar = "0.4"
flate2 = "1"
hostname = "0.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios"] }

[dev-dependencies]
aho-log.workspace = true
aho-types.workspace = true
axum.workspace = true
tempfile.workspace = true
parking_lot = "0.12"

[lints]
workspace = true
