[package]
name = "shared-auth"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"
publish = false

[dependencies]
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
url          = "2"
rand         = "0.8"
sha2         = "0.10"
base64       = "0.22"
jsonwebtoken = "9"
thiserror    = "2"
tokio        = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio    = { version = "1", features = ["full"] }
wiremock = "0.6"
