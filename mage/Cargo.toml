[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# ours
mage-core    = { path = "crates/mage-core" }
mage-infra   = { path = "crates/mage-infra" }
mage-server  = { path = "crates/mage-server" }
mage-indexer = { path = "crates/mage-indexer" }
mage-runner  = { path = "crates/mage-runner" }
shared-auth  = { path = "../shared/auth" }

# third-party
anyhow       = "1"
async-trait  = "0.1"
async-stream = "0.3"
aes-gcm      = "0.10"
arc-swap     = "1"
axum         = { version = "0.8", features = ["ws", "macros"] }
base64       = "0.22"
bytes        = "1"
clap         = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
futures      = "0.3"
futures-core = "0.3"
globset      = "0.4"
grep-matcher = "0.1"
grep-regex   = "0.1"
grep-searcher = "0.1"
hex          = "0.4"
hmac         = "0.12"
ignore       = "0.4"
jsonwebtoken = "9"
nix          = { version = "0.29", features = ["process", "signal", "user", "fs", "mount", "sched"] }
object_store = { version = "0.12", features = ["gcp", "aws"] }
parking_lot  = "0.12"
protobuf     = "3"
rand         = "0.8"
reflink-copy = "0.1"
regex        = "1"
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp         = { version = "3.5", features = ["server", "client", "macros", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
rusqlite     = { version = "0.32", features = ["bundled"] }
scip         = "0.5"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
sha2         = "0.10"
sqlx         = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "time", "uuid", "json", "migrate", "macros"] }
tar          = "0.4"
tempfile     = "3"
thiserror    = "2"
time         = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
tokio        = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util   = { version = "0.7", features = ["io", "rt"] }
toml         = "0.8"
tower        = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http   = { version = "0.6", features = ["fs", "trace", "limit", "set-header"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tree-sitter  = "0.25"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-clojure-orchard = "0.2"
ts-rs        = { version = "10", features = ["serde-compat", "uuid-impl"] }
url          = { version = "2", features = ["serde"] }
uuid         = { version = "1", features = ["v4", "v7", "serde"] }
wiremock     = "0.6"
zstd         = "0.13"
flate2       = "1"
schemars     = "1"
subtle       = "2"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
streaming-iterator = "0.1"
sha1         = "0.10"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
